<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Camarena - Océano</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            color: #f8fafc;
            margin: 0;
            padding: 15px;
            /* Fondo: Degradado sofisticado azul océano profundo */
            background: linear-gradient(180deg, #07162c 0%, #0b2240 100%);
            min-height: 100vh;
        }
        .app-container {
            max-width: 450px;
            margin: 0 auto;
        }
        /* Portada / Presentación */
        .presentacion {
            text-align: center;
            padding: 50px 20px 30px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 25px;
        }
        .presentacion h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 2px;
            color: #38bdf8;
            text-transform: uppercase;
        }
        .presentacion .sub {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 5px;
            margin-bottom: 15px;
        }
        .presentacion p {
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.6;
            margin: 0;
        }
        /* Categorías */
        .categorias-nav {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 15px;
        }
        .btn-categoria {
            background: rgba(255, 255, 255, 0.07);
            color: #cbd5e1;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-categoria.activo {
            background: #38bdf8;
            color: #07162c;
            border-color: #38bdf8;
        }
        /* Tarjetas de platillos */
        .tarjeta-platillo {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .info-texto {
            flex: 1;
        }
        .fila-superior {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
        }
        .titulo {
            font-size: 15px;
            font-weight: bold;
        }
        .costo {
            font-size: 14px;
            font-weight: 700;
            color: #38bdf8;
        }
        .detalles {
            font-size: 12px;
            color: #94a3b8;
            margin: 0;
            line-height: 1.4;
        }
        .thumb-platillo {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="presentacion">
        <h1>Camarena</h1>
        <div class="sub">Cocina de Mar</div>
        <p>Disfruta de una experiencia gastronómica inigualable donde la frescura del mar llega directo a tu mesa en cada platillo.</p>
    </div>

    <div class="categorias-nav">
        <span class="btn-categoria activo">Tostadas Especiales</span>
        <span class="btn-categoria">Entradas</span>
        <span class="btn-categoria">Bebidas</span>
    </div>

    <div class="tarjeta-platillo">
        <div class="info-texto">
            <div class="fila-superior">
                <span class="titulo">Tostada de Pulpo</span>
                <span class="costo">95</span>
            </div>
            <p class="detalles">Crujiente de maíz con base cremosa de aguacate, láminas tiernas de pulpo y aderezo artesanal.</p>
        </div>
        <img class="thumb-platillo" src="https://images.unsplash.com/photo-1565557623262-b51c2513a641?w=200&auto=format&fit=crop&q=60" alt="Tostada">
    </div>
</div>

</body>
</html>
